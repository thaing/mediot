name: CI for MedIoT
on:
  push:
    branches:  # also trigger via tags/releases later
      - main
      - mediot-gh-action
    # tags:
    #   - v*

env:
  IMAGE_NAME: mediot
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # needed to push to ghcr.io

    steps:
      - uses: actions/checkout@v6
      - name: Set API image tag
        id: api
        run: |
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}-api:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.api.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update GitOps repo API image tag
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE: ${{ steps.api.outputs.image }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/thaing/gitops.git
          cd gitops
          sed -i "s#image: .*#image: ${IMAGE}#" apps/mediot/base/api-deployment.yaml
          git -c user.name=ci -c user.email=ci@github commit -am "Bump image to ${IMAGE}"
          git push

      - name: Set Worker image tag
        id: worker
        run: |
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}-worker:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Build and push Worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.worker.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update GitOps repo Worker image tag
        env:
          IMAGE: ${{ steps.worker.outputs.image }}
        run: |
          cd gitops
          sed -i "s#image: .*#image: ${IMAGE}#" apps/mediot/base/worker-deployment.yaml
          git -c user.name=ci -c user.email=ci@github commit -am "Bump image to ${IMAGE}"
          git push

      - name: Set Frontend image tag
        id: frontend
        run: |
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}-frontend:${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update GitOps repo Frontend image tag
        env:
          IMAGE: ${{ steps.frontend.outputs.image }}
        run: |
          cd gitops
          sed -i "s#image: .*#image: ${IMAGE}#" apps/mediot/base/frontend-deployment.yaml
          git -c user.name=ci -c user.email=ci@github commit -am "Bump image to ${IMAGE}"
          git push
      - name: Trigger ArgoCD refresh
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          REPO: thaing/gitops
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITOPS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/dispatches" \
            -d '{"event_type":"trigger-argo-sync"}'
